services:
  app:
    build: .
    container_name: kitkaraoke-tv1-app
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      PAIR_TTL_SECONDS: "300"
      RECEIVER_TTL_SECONDS: "86400"
      APP_VERSION: "tv1-dev"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8791:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kitkaraoke-tv1-redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--save","60","100"]
    volumes:
      - kitkaraoke_tv1_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  kitkaraoke_tv1_redis:
