services:
  app:
    build: .
    container_name: kitkaraoke-tv1-app
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      PAIR_TTL_SECONDS: "300"
      RECEIVER_TTL_SECONDS: "86400"
      APP_VERSION: "tv1-webrtc-diag-1"
      LOG_LEVEL: INFO
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: tv1.kitkaraoke.com
      TURN_TTL_SECONDS: "3600"
    ports:
      - "127.0.0.1:8791:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kitkaraoke-tv1-redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--save","60","100"]
    volumes:
      - kitkaraoke_tv1_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.3
    container_name: kitkaraoke-tv1-turn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=tv1.kitkaraoke.com
      - --no-cli
      - --no-tls
      - --no-dtls

volumes:
  kitkaraoke_tv1_redis:
