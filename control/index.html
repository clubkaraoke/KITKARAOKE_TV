<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITKARAOKE Control</title><link rel="stylesheet" href="../assets/app.css"><script src="../assets/config.js"></script><script src="../assets/pairing.js"></script></head><body><div class="shell"><header class="topbar"><div class="brand"><span class="dot"></span>KITKARAOKE CONTROL</div><span class="badge">TV1 · VINCULACIÓN REAL</span></header><main class="main"><section class="hero"><div class="card"><h2 class="panel-title">Vincular televisor</h2><p class="subtitle" style="font-size:15px">Abre KITKARAOKE TV en el televisor. Escribe aquí el código temporal de 4 dígitos que aparece en pantalla.</p><label style="display:block;margin:18px 0 7px;color:var(--muted)">Código</label><div class="form-row"><input id="code" class="input" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="4827"><button id="pair" class="btn primary">VINCULAR</button></div><label style="display:block;margin:14px 0 7px;color:var(--muted)">Nombre de la pantalla</label><input id="name" class="input" value="TV SALA"><div id="log" class="log">Servidor listo. Esperando código.</div></div><div class="card pair-box"><div class="pair-label">Estado</div><div id="state" style="font-size:28px;font-weight:800;margin:22px 0">TV SIN VINCULAR</div><div id="detail" class="wait">El código vence automáticamente y solo puede usarse una vez.</div></div></section></main></div><script>
const log=t=>document.getElementById("log").textContent=t;
document.getElementById("pair").onclick=async()=>{
 const code=document.getElementById("code").value.trim(),name=document.getElementById("name").value.trim()||"TV SALA";
 log("Vinculando código "+code+"...");
 try{
   const r=await KIT_PAIR.claim(code,name);
   document.getElementById("state").textContent=r.name+" · CONECTADA ✓";
   document.getElementById("detail").textContent="Receptor "+r.receiverId.slice(0,8)+"…";
   log("Vinculación correcta.\nTV: "+r.name+"\nReceptor: "+r.receiverId+"\nCódigo consumido correctamente.");
 }catch(e){
   document.getElementById("state").textContent="NO VINCULADA";
   document.getElementById("detail").textContent=e.message;
   log("ERROR: "+e.message);
 }
};
</script></body></html>
