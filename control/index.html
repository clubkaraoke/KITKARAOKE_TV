<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITKARAOKE Control</title><link rel="stylesheet" href="../assets/app.css"><script src="../assets/config.js"></script><script src="../assets/pairing.js"></script></head><body><div class="shell"><header class="topbar"><div class="brand"><span class="dot"></span>KITKARAOKE CONTROL</div><a class="badge" href="../">Inicio</a></header><main class="main"><section class="hero"><div class="card"><h2 class="panel-title">Vincular televisor</h2><p class="subtitle" style="font-size:15px">Escribe el código que aparece en la TV. En esta preview la simulación funciona entre pestañas del mismo navegador. El backend real de OVH permitirá hacerlo entre PC y Smart TV.</p><label style="display:block;margin:18px 0 7px;color:var(--muted)">Código de 4 dígitos</label><div class="form-row"><input id="code" class="input" inputmode="numeric" maxlength="4" placeholder="4827"><button id="pair" class="btn primary">VINCULAR</button></div><label style="display:block;margin:14px 0 7px;color:var(--muted)">Nombre</label><input id="name" class="input" value="TV SALA"><div id="log" class="log">Sistema listo.</div></div><div class="card pair-box"><div class="pair-label">Estado</div><div id="state" style="font-size:28px;font-weight:800;margin:22px 0">TV SIN VINCULAR</div><div id="detail" class="wait">Esperando código...</div></div></section></main></div><script>const log=t=>document.getElementById("log").textContent=t;document.getElementById("pair").onclick=async()=>{const code=document.getElementById("code").value;const name=document.getElementById("name").value;log("Intentando vincular "+code+"...");try{const r=await KIT_PAIR.claim(code,name);document.getElementById("state").textContent=(r.name||name)+" · CONECTADA";document.getElementById("detail").textContent="Receptor "+r.receiverId;log("Vinculación correcta.\nModo: "+r.mode+"\nReceiver: "+r.receiverId);}catch(e){document.getElementById("state").textContent="NO VINCULADA";document.getElementById("detail").textContent=e.message;log("ERROR: "+e.message);}};</script></body></html>
