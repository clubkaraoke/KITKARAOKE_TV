<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico KITKARAOKE TV</title><link rel="stylesheet" href="../assets/app.css"></head><body><div class="shell"><header class="topbar"><div class="brand"><span class="dot"></span>DIAGNÓSTICO TV</div><a class="badge" href="../">Inicio</a></header><main class="main"><div class="card"><h1 style="margin-top:0">Compatibilidad del navegador</h1><p class="subtitle" style="font-size:15px">Abre esta página directamente desde la Smart TV para saber qué tecnologías podremos usar.</p><div id="diag" class="diag"></div><div class="actions"><button id="full" class="btn primary">Probar pantalla completa</button><button id="rerun" class="btn">Repetir diagnóstico</button></div></div></main></div><script>function row(n,v,s){return '<div class="diag-row"><span>'+n+'</span><strong class="'+s+'">'+v+'</strong></div>'}function run(){const out=[];out.push(row("WebRTC",window.RTCPeerConnection?"DISPONIBLE":"NO",""+(window.RTCPeerConnection?"ok":"bad")));out.push(row("WebSocket",window.WebSocket?"DISPONIBLE":"NO",window.WebSocket?"ok":"bad"));const fs=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);out.push(row("Fullscreen",fs?"DISPONIBLE":"NO",fs?"ok":"bad"));let h264=false;try{h264=!!(window.MediaSource&&MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'))}catch(e){}out.push(row("H.264 + AAC (fMP4)",h264?"COMPATIBLE":"NO CONFIRMADO",h264?"ok":"maybe"));out.push(row("LocalStorage",(()=>{try{localStorage.setItem("_kit","1");localStorage.removeItem("_kit");return true}catch(e){return false}})()?"OK":"NO",(()=>{try{return!!localStorage}catch(e){return false}})()?"ok":"bad"));out.push(row("HTTPS",location.protocol==="https:"?"SÍ":"NO",location.protocol==="https:"?"ok":"maybe"));document.getElementById("diag").innerHTML=out.join("")}run();document.getElementById("rerun").onclick=run;document.getElementById("full").onclick=()=>{const el=document.documentElement;const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)f.call(el)};</script></body></html>
