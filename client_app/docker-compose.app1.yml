services:
  app:
    build: .
    container_name: kitkaraoke-app1-client
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TV_API_BASE: http://host.docker.internal\n      TV_API_HOST: tv1.kitkaraoke.com
      ENVIRONMENT: app1
      DEV_TRIALS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8792:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
